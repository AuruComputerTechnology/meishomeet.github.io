<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meisho Meetログイン</title>
  <style>
    :root{--blue:#315da8;--red:#db3434;--ink:#20242a;--line:#dfe3e8;--muted:#777}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:28px}
    .panel{width:min(820px,100%)}
    .title{display:flex;justify-content:center;align-items:center;gap:16px;color:var(--blue);font-size:clamp(27px,4vw,43px);font-weight:800;margin:0 0 22px}
    .download{width:56px;height:56px;border:4px solid var(--blue);border-radius:50%;display:grid;place-items:center;font-size:35px;line-height:1}
    .intro{text-align:center;font-size:clamp(16px,2.4vw,22px);margin:0 0 46px}
    .form{display:grid;gap:24px}
    .row{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:20px}
    label{text-align:right;font-size:21px}.required{color:var(--red);margin-right:9px}
    input{width:100%;height:68px;border:1px solid var(--line);font-size:20px;padding:0 20px;outline:none;transition:.18s}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #315da820}
    button{border:0;cursor:pointer;font:inherit}
    .submit{width:calc(100% - 190px);margin-left:190px;height:72px;background:var(--blue);color:#fff;font-size:22px;margin-top:12px;transition:.18s}
    .submit:hover{filter:brightness(.94)}
    .note{text-align:right;color:#555;margin-top:20px}.note span{color:var(--red)}
    .error{display:none;grid-template-columns:1.05fr .95fr;align-items:center;gap:20px;min-height:650px}
    .error h1{font-family:serif;color:var(--red);font-size:clamp(58px,9vw,100px);line-height:1;margin:0 0 80px;text-shadow:0 2px #8c1515}
    .message{font-family:serif;font-size:clamp(27px,4vw,45px);letter-spacing:.05em;margin-bottom:110px}
    .retry{background:none;color:#b71919;font-family:serif;font-weight:800;font-size:clamp(25px,3.5vw,38px);padding:0}.retry:hover{text-decoration:underline}
    .character{width:100%;max-height:650px;object-fit:contain}
    body.show-error .request{display:none}
    body.show-error .error{display:grid}
    @media(max-width:680px){
      main{padding:20px}.row{grid-template-columns:1fr;gap:8px}label{text-align:left}.submit{width:100%;margin-left:0}.intro{margin-bottom:30px}
      .error{grid-template-columns:1fr;text-align:center;min-height:auto}.error h1{margin-bottom:25px}.message{margin-bottom:35px}.character{max-height:390px;grid-row:1}.error-copy{grid-row:2}
    }
    @media(prefers-reduced-motion:no-preference){body.show-error .error{animation:appear .25s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main>
    <section class="panel request" aria-labelledby="page-title">
      <h1 class="title" id="page-title"><span class="download" aria-hidden="true">↓</span>Meisho Meetログイン</h1>
      <p class="intro">偉大な計画は，堅実な道具から</p>
      <form class="form" id="joke-form">
        <div class="row"><label for="meisho-id"><span class="required">＊</span>Meisho ID：</label><input id="meisho-id" name="meisho-id" autocomplete="off" placeholder="Meisho IDを入力" required></div>
        <div class="row"><label for="affiliation"><span class="required">＊</span>所属系統：</label><input id="affiliation" name="affiliation" autocomplete="off" placeholder="所属系統を入力" required></div>
        <button class="submit" type="submit">情報を送信</button>
      </form>
      <p class="note"><span>＊</span> 必須項目</p>
    </section>

    <section class="panel error" aria-live="assertive" aria-labelledby="error-title">
      <div class="error-copy">
        <h1 id="error-title">無信号</h1>
        <p class="message">現在接続ができません</p>
        <button class="retry" id="retry" type="button">再試行</button>
      </div>
      <img class="character" src="https://raw.githubusercontent.com/AuruComputerTechnology/AuruPhotoCutter/main/そらきゅん.png" alt="そらきゅね">
    </section>
  </main>
  <script>
    const form = document.getElementById('joke-form');
    const retry = document.getElementById('retry');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      document.body.classList.add('show-error');
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
    retry.addEventListener('click', () => {
      document.body.classList.remove('show-error');
      form.reset();
      document.getElementById('meisho-id').focus();
    });
  </script>
</body>
</html>
